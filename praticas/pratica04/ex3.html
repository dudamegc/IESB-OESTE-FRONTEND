<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React para Iniciantes</title>

     <!-- Carrega o React, React Dom e Babel -->
    <script crossorigin="" src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
     <!-- Don't use this in production: -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="app-javascript">
        <p>Total: <span id="total"></span></p>
        <p>Preço: R$<span id="preco"></span></p>
        <button id="button1">Comprar</button>
    </div>
    <script type="application/javascript">
        const total = document.getElementById('total');
        const preco = document.getElementById('preco');
        const button = document.getElementById('total');

        let contador= 1;

        function atualizarValores(contador) {
            total.innerText = contador;
            preco.innerText = contador * 250
        }
        


        function handleClick() {
            contador = contador + 1;
            atualizarValores(contador);
        }

        button1.addEventListener('click', handleClick)

    </script>

    <div id="app-react"></div>
    <script type="text/babel">
        const Comprar = () => {
            const [count, setCount] = React.useState(1);

            function handleClick () {
                setCount (count + 1);
            }
            return <div>
                <button onClick={handleClick}>Comprar: {count[0]}</button>
                <p>Total: {count}</p>
                <p>Preço: {count * 250}</p>
                </div>
        }

        ReactDOM.createRoot(document.getElementById('app-react')).render(<Comprar />)
    </script>
</body>
</html>
